<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tvastra Studio | High-End Production House</title>
    <!-- Premium Fonts: Syne for headings, Inter for body -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&family=Syne:wght@600;800&display=swap" rel="stylesheet">
    <style>
        /* CSS Variables & Reset */
        :root {
            --bg-dark: #050505;
            --text-light: #f4f4f4;
            --accent: #ff4a00; /* Creative Orange/Red Accent */
        }
        * { margin: 0; padding: 0; box-sizing: border-box; cursor: none; /* Custom Cursor */ }
        body { font-family: 'Inter', sans-serif; background-color: var(--bg-dark); color: var(--text-light); overflow-x: hidden; }
        a { text-decoration: none; color: inherit; }

        /* Custom Cursor */
        .cursor { width: 20px; height: 20px; border: 2px solid var(--accent); border-radius: 50%; position: fixed; pointer-events: none; z-index: 9999; transform: translate(-50%, -50%); transition: width 0.3s, height 0.3s; }
        .cursor-dot { width: 6px; height: 6px; background: var(--accent); border-radius: 50%; position: fixed; pointer-events: none; z-index: 9999; transform: translate(-50%, -50%); }

        /* Navbar (Multi-page Setup) */
        nav { display: flex; justify-content: space-between; align-items: center; padding: 30px 60px; position: absolute; width: 100%; top: 0; z-index: 100; mix-blend-mode: difference; }
        nav .logo { font-family: 'Syne', sans-serif; font-size: 24px; font-weight: 800; letter-spacing: 2px; }
        nav ul { display: flex; gap: 40px; list-style: none; }
        nav ul li a { font-size: 14px; font-weight: 500; text-transform: uppercase; letter-spacing: 1px; position: relative; }
        nav ul li a::after { content: ''; position: absolute; width: 0; height: 2px; bottom: -5px; left: 0; background-color: var(--accent); transition: width 0.3s; }
        nav ul li a:hover::after { width: 100%; }

        /* Hero Section with 3D Model */
        .hero { height: 100vh; display: flex; align-items: center; justify-content: space-between; padding: 0 60px; position: relative; }
        .hero-content { width: 50%; z-index: 10; }
        .hero-content h1 { font-family: 'Syne', sans-serif; font-size: 5vw; line-height: 1; margin-bottom: 20px; text-transform: uppercase; clip-path: polygon(0 100%, 100% 100%, 100% 100%, 0% 100%); /* For GSAP Animation */ }
        .hero-content p { font-size: 1.2rem; font-weight: 300; opacity: 0.7; max-width: 500px; margin-bottom: 40px; }
        
        /* 3D Model Container */
        .model-container { width: 50%; height: 100vh; position: absolute; right: 0; top: 0; z-index: 1; pointer-events: auto; }

        /* Stats Section */
        .stats-section { padding: 100px 60px; display: flex; justify-content: space-around; background: #0a0a0a; border-top: 1px solid #222; border-bottom: 1px solid #222; }
        .stat-box { text-align: center; }
        .stat-number { font-family: 'Syne', sans-serif; font-size: 4.5rem; font-weight: 800; color: var(--accent); }
        .stat-label { font-size: 1.1rem; letter-spacing: 2px; text-transform: uppercase; opacity: 0.8; margin-top: 10px; }

        /* Explore Button */
        .explore-btn { padding: 18px 40px; background: transparent; border: 1px solid var(--text-light); color: var(--text-light); font-family: 'Inter', sans-serif; font-size: 14px; text-transform: uppercase; letter-spacing: 2px; transition: 0.4s; position: relative; overflow: hidden; z-index: 1; }
        .explore-btn::before { content: ''; position: absolute; top: 0; left: -100%; width: 100%; height: 100%; background: var(--accent); z-index: -1; transition: 0.4s; }
        .explore-btn:hover::before { left: 0; }
        .explore-btn:hover { border-color: var(--accent); }
    </style>
    <!-- Spline 3D Viewer Script -->
    <script type="module" src="https://unpkg.com/@splinetool/viewer@1.0.51/build/spline-viewer.js"></script>
</head>
<body>

    <!-- Custom Cursor Elements -->
    <div class="cursor"></div>
    <div class="cursor-dot"></div>

    <!-- Navigation -->
    <nav>
        <div class="logo">TVASTRA.</div>
        <ul>
            <li><a href="index.html">Home</a></li>
            <li><a href="work.html">Work</a></li>
            <li><a href="about.html">About</a></li>
            <li><a href="contact.html">Contact</a></li>
        </ul>
    </nav>

    <!-- Hero Section -->
    <section class="hero">
        <div class="hero-content">
            <h1 class="anim-title">We Craft</h1>
            <h1 class="anim-title" style="color: var(--accent);">Visual Masterpieces</h1>
            <p class="anim-text">India's leading production house. Blending cinematic storytelling with cutting-edge visual effects to elevate your brand.</p>
            <a href="work.html" class="explore-btn anim-btn">Explore Our Work</a>
        </div>
        
        <!-- 3D Model Embed (Interactive Camera/Abstract Shape) -->
        <div class="model-container">
            <spline-viewer url="https://prod.spline.design/6Wq1Q7YGyM-iab9i/scene.splinecode"></spline-viewer>
        </div>
    </section>

    <!-- Milestone & Stats Section -->
    <section class="stats-section">
        <div class="stat-box">
            <div class="stat-number">50+</div>
            <div class="stat-label">Brands Empowered</div>
        </div>
        <div class="stat-box">
            <div class="stat-number">150+</div>
            <div class="stat-label">Projects Delivered</div>
        </div>
        <div class="stat-box">
            <div class="stat-number">Pan</div>
            <div class="stat-label">India Reach</div>
        </div>
    </section>

    <!-- GSAP Animation Scripts -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script>
        // Custom Cursor Logic
        const cursor = document.querySelector('.cursor');
        const cursorDot = document.querySelector('.cursor-dot');
        document.addEventListener('mousemove', (e) => {
            cursor.style.left = e.clientX + 'px';
            cursor.style.top = e.clientY + 'px';
            cursorDot.style.left = e.clientX + 'px';
            cursorDot.style.top = e.clientY + 'px';
        });

        // Add hover effect to links for custom cursor
        document.querySelectorAll('a, .explore-btn, spline-viewer').forEach(el => {
            el.addEventListener('mouseenter', () => cursor.style.transform = 'translate(-50%, -50%) scale(2)');
            el.addEventListener('mouseleave', () => cursor.style.transform = 'translate(-50%, -50%) scale(1)');
        });

        // GSAP Intro Animations
        gsap.to('.anim-title', { 
            clipPath: 'polygon(0 0%, 100% 0%, 100% 100%, 0% 100%)', 
            duration: 1.5, 
            stagger: 0.2, 
            ease: 'power4.out', 
            delay: 0.5 
        });
        
        gsap.from('.anim-text', { 
            opacity: 0, 
            y: 30, 
            duration: 1, 
            delay: 1.2, 
            ease: 'power3.out' 
        });

        gsap.from('.anim-btn', { 
            opacity: 0, 
            y: 20, 
            duration: 1, 
            delay: 1.5, 
            ease: 'power3.out' 
        });

        gsap.from('.stat-box', {
            opacity: 0,
            y: 50,
            stagger: 0.2,
            duration: 1,
            scrollTrigger: {
                trigger: '.stats-section',
                start: 'top 80%'
            }
        });
    </script>
</body>
</html>
